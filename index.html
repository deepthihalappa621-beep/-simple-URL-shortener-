<!DOCTYPE html>
<html>
<head>
    <title>Simple URL Shortener</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg,#4facfe,#00f2fe);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            margin:0;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.2);
            text-align:center;
            width:500px;
        }

        h1{
            color:#333;
        }

        input{
            width:90%;
            padding:12px;
            margin-top:10px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        button{
            margin-top:15px;
            padding:12px 25px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .result{
            margin-top:20px;
            padding:10px;
            background:#f0f0f0;
            border-radius:8px;
        }

        a{
            color:green;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔗 URL Shortener</h1>

    <form method="POST">

        <input
            type="url"
            name="long_url"
            placeholder="Paste your long URL here"
            required
        >

        <br>

        <button type="submit">
            Shorten URL
        </button>

    </form>

    {% if short_url %}
    <div class="result">
        <p>Short URL:</p>

        <a href="{{ short_url }}" target="_blank">
            {{ short_url }}
        </a>
    </div>
    {% endif %}

</div>

</body>
</html>
